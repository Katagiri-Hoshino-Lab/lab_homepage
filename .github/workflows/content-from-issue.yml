# 「論文・発表を追加」「ニュースを追加」の Issue フォームから、サイト更新用の PR を自動で作る。
# Issue を編集すると PR も作り直される。
name: Content from issue

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: content-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  create-pr:
    # 研究室メンバー（リポジトリのコラボレーター・Organization メンバー）の Issue のみ処理する
    if: >-
      github.event.issue.state == 'open' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      # runner コンテキストはジョブの env では使えないため、ここで設定する
      - run: echo "OUT=$RUNNER_TEMP/content" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Issue 本文はイベント JSON から読む（シェルに直接展開しない）
      - name: Generate content from issue
        id: generate
        run: |
          node scripts/issue-to-content.mjs "$GITHUB_EVENT_PATH" "$OUT"
          echo "kind=$(cat "$OUT/kind")" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate and build
        if: steps.generate.outputs.kind != 'none'
        run: |
          set -o pipefail
          npm run validate 2>&1 | tee "$OUT/validate.log"
          npm run build

      - name: Prepare PR text
        id: text
        if: steps.generate.outputs.kind != 'none'
        run: echo "title=$(cat "$OUT/pr-title")" >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        id: pr
        if: steps.generate.outputs.kind != 'none'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: content/issue-${{ github.event.issue.number }}
          title: ${{ steps.text.outputs.title }}
          body-path: ${{ env.OUT }}/pr-body.md
          commit-message: ${{ steps.text.outputs.title }} (#${{ github.event.issue.number }})
          add-paths: |
            content/**
            public/img/news/**
          labels: content
          delete-branch: true

      - name: Comment on issue
        if: steps.pr.outputs.pull-request-url != ''
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
        run: |
          if [ "$OPERATION" = "created" ]; then
            msg="✅ サイト更新用の PR を作成しました: $PR_URL"
          else
            msg="🔄 Issue の変更を PR に反映しました: $PR_URL"
          fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$msg

          内容を確認してマージすると、サイトに反映されます。"

      - name: Report failure on issue
        if: failure()
        run: |
          if [ -f "$OUT/comment.md" ]; then
            body_file="$OUT/comment.md"
          else
            body_file="$OUT/failure.md"
            {
              echo "⚠️ **サイトへの反映用 PR を作成できませんでした。**"
              echo
              if [ -s "$OUT/validate.log" ]; then
                echo '```'
                tail -n 30 "$OUT/validate.log"
                echo '```'
              fi
              echo
              echo "詳細: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo
              echo "Issue を編集して内容を直すと、自動で再実行されます。"
            } > "$body_file"
          fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
