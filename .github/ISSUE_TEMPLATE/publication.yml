name: 論文・発表を追加
description: 論文・学会発表・ポスターなどをサイトに追加します。DOI か arXiv を入れるだけで、タイトルや著者は自動で取得されます。
title: "[論文・発表] "
labels: ["content"]
body:
  - type: markdown
    attributes:
      value: |
        送信すると、サイトを更新する Pull Request が自動で作られます（1〜2分）。PR がマージされるとサイトに反映されます。

        **入力のしかた（どれか1つで OK）**
        1. **DOI か arXiv がある** → 「DOI / arXiv」欄に貼るだけ。残りは空欄で構いません（取得できた情報より、手で入力した値が優先されます）
        2. **BibTeX がある** → 「BibTeX」欄に貼り付け。複数件をまとめて追加できます
        3. **どちらもない**（国内発表など） → タイトル・著者・会議名・発表日を入力
  - type: input
    attributes:
      label: DOI / arXiv
      description: URL のままでも構いません。両方ある場合はスペース区切りで両方入れてください。
      placeholder: "https://doi.org/10.1145/3784828.3785335  https://arxiv.org/abs/2510.00031"
  - type: textarea
    attributes:
      label: BibTeX
      description: Google Scholar・DBLP・ACM・IEEE などからコピーした BibTeX。複数件まとめて貼れます。
      render: bibtex
  - type: dropdown
    attributes:
      label: 種別
      description: DOI / BibTeX から判定できない場合（arXiv のみ・国内発表など）は選んでください。
      options:
        - 自動判定
        - 論文誌
        - 国際会議
        - ワークショップ
        - 国内発表
        - 招待講演
        - ポスター
      default: 0
    validations:
      required: true
  - type: input
    attributes:
      label: タイトル
  - type: textarea
    attributes:
      label: 著者
      description: 1行に1人、またはカンマ区切り。
      placeholder: |
        樹神宇徳
        椋木大地
        片桐孝洋
  - type: input
    attributes:
      label: 会議名・論文誌名
      placeholder: 情報処理学会 第88回全国大会
  - type: input
    attributes:
      label: 発表日・公開日
      description: YYYY-MM-DD（年だけでも可）。空欄なら DOI / arXiv / BibTeX の日付を使います。
      placeholder: "2026-03-15"
  - type: input
    attributes:
      label: ページ
      placeholder: "353-360"
  - type: input
    attributes:
      label: PDF・スライドなどの URL
  - type: checkboxes
    attributes:
      label: オプション
      options:
        - label: 代表論文として表示する
        - label: トップの「最新情報」にも載せる
